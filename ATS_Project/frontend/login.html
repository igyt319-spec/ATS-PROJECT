<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | AI-Based Academic Tracking System (ATS)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
</head>
<body class="login-page">

  <!-- Background Ambient Glow Orbs -->
  <div style="position: absolute; width: 450px; height: 450px; border-radius: 50%; background: radial-gradient(circle, rgba(56, 189, 248, 0.15), transparent 70%); top: 10%; left: 15%; filter: blur(50px); pointer-events: none;"></div>
  <div style="position: absolute; width: 450px; height: 450px; border-radius: 50%; background: radial-gradient(circle, rgba(129, 140, 248, 0.15), transparent 70%); bottom: 10%; right: 15%; filter: blur(50px); pointer-events: none;"></div>

  <div class="login-card">
    <div class="login-header">
      <div style="display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 12px;">
        <div class="logo-badge">ATS</div>
        <div style="text-align: left;">
          <h1 style="font-size: 1.3rem; font-weight: 800; line-height: 1.1; color: #fff;">Academic Tracking System</h1>
          <span style="font-size: 0.72rem; color: var(--accent-cyan); font-weight: 700; letter-spacing: 1px;">INTELLIGENT AI PORTAL</span>
        </div>
      </div>
      <h2 style="font-size: 1.5rem; font-weight: 700; margin-top: 14px;">Welcome Back 👋</h2>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Sign in to continue to your academic dashboard.</p>
    </div>

    <!-- Role Selection Tabs -->
    <div class="role-switcher">
      <div class="role-tab active" id="tab-student" onclick="selectRole('student')">👨‍🎓 Student</div>
      <div class="role-tab" id="tab-admin" onclick="selectRole('admin')">🏛️ Faculty / Admin</div>
    </div>

    <!-- Login Form -->
    <form id="login-form">
      <div class="form-group">
        <label class="form-label" id="identifier-label">Register Number / Institutional Email</label>
        <div style="position: relative;">
          <input type="text" id="login-identifier" class="form-control" placeholder="e.g. ATS001 or student@ats.com" required autocomplete="username">
          <span style="position: absolute; right: 14px; top: 12px; color: var(--text-dim);">👤</span>
        </div>
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <label class="form-label" style="margin-bottom: 0;">Password</label>
          <a href="javascript:void(0)" onclick="openModal('forgot-modal')" style="font-size: 0.78rem;">Forgot Password?</a>
        </div>
        <div style="position: relative;">
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" id="toggle-password" style="position: absolute; right: 14px; top: 10px; background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 1.1rem;">👁️</button>
        </div>
      </div>

      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; font-size: 0.84rem;">
        <label style="display: flex; align-items: center; gap: 8px; color: var(--text-muted); cursor: pointer;">
          <input type="checkbox" id="remember-me" checked style="accent-color: var(--accent-cyan); width: 16px; height: 16px;">
          Remember Me
        </label>
        <span style="color: var(--text-dim); font-size: 0.75rem;">🔒 Protected by ATS Auth</span>
      </div>

      <!-- Error / Status Message Container -->
      <div id="login-error" style="display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 10px 14px; border-radius: var(--radius-sm); font-size: 0.84rem; margin-bottom: 18px; text-align: center;"></div>

      <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; padding: 13px; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.5px;">
        <span id="btn-text">SIGN IN →</span>
        <span id="btn-spinner" style="display: none;">Authenticating... ⏳</span>
      </button>
    </form>
  </div>

  <!-- Forgot Password Modal (Requirement 5) -->
  <div class="modal-backdrop" id="forgot-modal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">Reset Password</h3>
        <button class="modal-close" data-modal-close>&times;</button>
      </div>
      <p style="color: var(--text-muted); font-size: 0.88rem; margin-bottom: 18px;">
        Enter your registered institutional email to receive a password reset link.
      </p>
      <form id="forgot-form">
        <div class="form-group">
          <label class="form-label">Institutional Email</label>
          <input type="email" id="forgot-email" class="form-control" placeholder="e.g. student@ats.com" required>
        </div>
        <div id="forgot-status" style="display: none; padding: 10px; border-radius: 6px; font-size: 0.84rem; margin-bottom: 14px;"></div>
        <div style="display: flex; justify-content: flex-end; gap: 10px;">
          <button type="button" class="btn btn-secondary" data-modal-close>Cancel</button>
          <button type="submit" class="btn btn-primary">Send Reset Request</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="api.js"></script>
  <script src="login.js"></script>
</body>
</html>
